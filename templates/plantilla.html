
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Priority Pulse{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/actividades.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar">
        <div class="box">
            <div id="racha-info" class="racha-simplificada">
                <span id="emoji-racha">😊</span>
                <span id="dias-racha" style="color: red;">{{ racha if racha is defined else 0 }}</span> días en racha
            </div>
        </div>
        <a href="{{ url_for('rutinas.mostrar_rutinas') }}">Rutinas</a>
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="logo-nav">
        <a href="{{ url_for('listaActividades.actividades') }}">Actividades</a>
        <a href="{{ url_for('login.home') }}">Cerrar Sesión</a>
    </nav>

    {% block content %}{% endblock %}

    <script>
        function actualizarEmojiRacha(racha) {
            const emoji = document.getElementById('emoji-racha');
            if (emoji) {
                if (racha >= 30) emoji.innerText = '🏆';
                else if (racha >= 20) emoji.innerText = '💪';
                else if (racha >= 10) emoji.innerText = '🔥';
                else if (racha >= 5) emoji.innerText = '😎';
                else if (racha >= 1) emoji.innerText = '😊';
                else emoji.innerText = '😴';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const diasRacha = parseInt(document.getElementById('dias-racha')?.innerText) || 0;
            actualizarEmojiRacha(diasRacha);
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
