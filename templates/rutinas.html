<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Rutinas - Priority Pulse</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/rutinas.css') }}">
</head>

<body>


  <nav class="navbar">
    <div class="box">
      <button class="open-modal-btn">
        <span id="racha-fuego" class="racha" style="color: {{ color_racha }}">
          {{ racha }} 🔥
          <span class="manita">✋</span>
          <span class="carita">😊</span>
        </span>
      </button>
    </div>
    <a href="">Perfil</a>
    <a href="">Rutinas</a>
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="logo-nav">
    <a href="{{ url_for('listaActividades.actividades') }}">Actividades</a>
    <a href="">Cerrar Sesión</a>
  </nav>


  <main class="contenedor">
    <h1>Rutinas</h1>
    <div class="tarjetas">
      {% for rutina in rutinas %}
      <div class="rutina-card">
        <h3>{{ rutina.titulo }}</h3>
        <p>{{ rutina.descripcion }}</p>
        <form method="POST" action="{{ url_for('rutinas.agregar_rutina', id=rutina.id) }}">
          <button type="submit">Añadir a mis actividades</button>
        </form>
      </div>
      {% endfor %}

    </div>
  </main>

</body>

</html>
